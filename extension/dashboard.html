<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PaperTrench</title>
  <style>
    /* ==========================================================
       PaperTrench dashboard — design system
       ========================================================== */
    :root {
      --void: #06080C;
      --bg: #0A0D13;
      --panel: rgba(20, 24, 32, 0.72);
      --panel-solid: #12161E;
      --raised: rgba(255, 255, 255, 0.045);
      --line: rgba(255, 255, 255, 0.075);
      --line-2: rgba(255, 255, 255, 0.14);
      --text: #EAEFF7;
      --dim: #8D97A9;
      --faint: #5A6273;
      --amber: #FF9D45;
      --amber-2: #FFC081;
      --green: #34D399;
      --red: #FF5F56;
      --blue: #6AA9FF;
      --violet: #A78BFA;
      --r-xl: 20px;
      --r-lg: 15px;
      --r-md: 11px;
      --r-sm: 8px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      --shadow-lg: 0 24px 60px -18px rgba(0, 0, 0, 0.7);
      --shadow-md: 0 10px 30px -12px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; }

    /* The hidden attribute must outrank every component's own display rule.
       [hidden] { display: none } is a UA rule, so any author rule with a class
       selector beats it: a component styled .thing { display: flex } renders
       while carrying hidden, and el.hidden = true does nothing. See the fuller
       note in popup.html, where that trap made the update banner permanent. */
    [hidden] { display: none !important; }


    html { scrollbar-color: rgba(255,255,255,0.16) transparent; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      /* Ambient depth — subtle, never noisy. */
      background-image:
        radial-gradient(900px 520px at 12% -8%, rgba(255, 157, 69, 0.07), transparent 62%),
        radial-gradient(760px 480px at 96% 4%, rgba(106, 169, 255, 0.05), transparent 60%);
      background-attachment: fixed;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.13); border-radius: 99px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.24); background-clip: content-box; }

    ::selection { background: rgba(255, 157, 69, 0.28); }

    /* ---------------- header ---------------- */

    header {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 16px;
      padding: 0 26px; height: 62px;
      background: rgba(10, 13, 19, 0.82);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    /* The mark is the plane on near-black, exactly as brand/logo.png is drawn.
       The old amber-filled tile cannot carry it: the plane is itself amber, so
       on that background it disappears. */
    .brand-mark {
      width: 30px; height: 30px; border-radius: 9px;
      display: grid; place-items: center;
      background: #0B0B0A;
      border: 1px solid rgba(255, 157, 69, 0.22);
      box-shadow: 0 5px 16px -5px rgba(255, 157, 69, 0.45);
    }
    .brand-mark svg { width: 19px; height: 19px; display: block; }
    h1 { margin: 0; font-size: 16px; font-weight: 750; letter-spacing: -0.3px; }
    .badge {
      padding: 3px 9px; border-radius: 999px;
      background: rgba(255, 157, 69, 0.13);
      border: 1px solid rgba(255, 157, 69, 0.3);
      color: var(--amber-2);
      font-size: 9px; font-weight: 800; letter-spacing: 1.2px;
    }

    nav { display: flex; gap: 3px; margin-left: auto; padding: 4px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--line); }
    nav button {
      position: relative;
      padding: 7px 15px; border: none; border-radius: var(--r-sm);
      background: transparent; color: var(--dim);
      font-family: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
      transition: color 0.16s, background 0.16s;
    }
    nav button:hover { color: var(--text); background: var(--raised); }
    nav button.active { color: var(--text); background: rgba(255,255,255,0.09); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
    nav button.active::after {
      content: ''; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
      width: 16px; height: 2px; border-radius: 2px; background: var(--amber);
    }
    .overlay-launch {
      padding: 8px 14px; border-radius: 10px; cursor: pointer;
      background: var(--raised); border: 1px solid var(--line-2); color: var(--text);
      font-family: inherit; font-size: 12.5px; font-weight: 650; white-space: nowrap;
      transition: background 0.16s, border-color 0.16s;
    }
    .overlay-launch:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.22); }

    /* ---------------- layout ---------------- */

    .wrap { display: flex; align-items: flex-start; min-height: calc(100vh - 62px); }
    aside {
      position: sticky; top: 62px;
      width: 246px; flex: none; padding: 20px 16px;
      max-height: calc(100vh - 62px); overflow-y: auto;
      border-right: 1px solid var(--line);
    }
    main { flex: 1; min-width: 0; padding: 22px 26px 60px; }

    /* ---------------- KPI cards ---------------- */

    .kpi {
      position: relative; overflow: hidden;
      padding: 13px 14px; margin-bottom: 9px;
      background: linear-gradient(140deg, rgba(255,255,255,0.05), rgba(255,255,255,0.014));
      border: 1px solid var(--line); border-radius: var(--r-lg);
      transition: border-color 0.2s, transform 0.2s var(--ease);
    }
    .kpi:hover { border-color: var(--line-2); transform: translateY(-1px); }
    .kpi .lab {
      font-size: 9.5px; font-weight: 700; letter-spacing: 1.1px;
      text-transform: uppercase; color: var(--faint);
    }
    .kpi .num { margin-top: 4px; font-size: 21px; font-weight: 800; letter-spacing: -0.6px; }
    .kpi.hero .num { font-size: 25px; }
    .kpi .sub { margin-top: 2px; font-size: 11px; color: var(--dim); font-weight: 600; }
    .spark-mini { display: block; width: 100%; height: 30px; margin-top: 7px; }

    /* ---------------- cards ---------------- */

    .card {
      padding: 17px 18px;
      background: linear-gradient(155deg, rgba(255,255,255,0.042), rgba(255,255,255,0.012));
      border: 1px solid var(--line); border-radius: var(--r-xl);
      box-shadow: var(--shadow-md);
    }
    .card h3 {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 14px;
      font-size: 10.5px; font-weight: 750; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--dim);
    }
    .card h4 { margin: 16px 0 8px; font-size: 12px; font-weight: 700; color: var(--dim); }
    /* ---------- what's new ---------- */
    #pt-whatsnew {
      position: fixed; inset: 0; z-index: 200;
      display: grid; place-items: center; padding: 24px;
      background: rgba(4, 6, 10, 0.72); backdrop-filter: blur(4px);
    }
    .wn-card {
      width: min(560px, 100%); max-height: 80vh; display: flex; flex-direction: column;
      background: var(--panel-solid); border: 1px solid var(--line-2);
      border-radius: var(--r-xl); box-shadow: var(--shadow-lg);
    }
    .wn-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 22px 12px; }
    .wn-kicker { font-size: 9.5px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; color: var(--amber); }
    .wn-head h2 { margin: 4px 0 0; font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .wn-close {
      margin-left: auto; width: 28px; height: 28px; flex: none;
      font: inherit; font-size: 17px; line-height: 1; cursor: pointer;
      color: var(--faint); background: none; border: 0; border-radius: 8px;
    }
    .wn-close:hover { color: var(--text); background: var(--raised); }
    .wn-body { overflow-y: auto; padding: 4px 22px 8px; }
    .wn-entry { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .wn-entry:last-child { border-bottom: none; }
    .wn-entry h3 { margin: 0 0 5px; font-size: 14px; font-weight: 750; color: var(--text); letter-spacing: 0; text-transform: none; }
    .wn-entry p { margin: 0; font-size: 13px; line-height: 1.62; color: var(--dim); }
    .wn-foot {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 22px 18px; border-top: 1px solid var(--line);
    }
    .wn-foot a { color: var(--amber); font-size: 12.5px; font-weight: 650; text-decoration: none; }
    .wn-foot a:hover { text-decoration: underline; }
    .wn-foot .btn { margin-left: auto; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(370px, 1fr)); gap: 16px; align-items: start; }

    /* ---------- preset rows ----------
       One box per button, instead of a text field holding "0.1, 0.5, 1, 2".
       Each box is the size of the value it holds, so the row reads as the row
       of buttons it becomes in the overlay. */
    .preset-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin: 2px 0 4px; }
    .preset-box { position: relative; display: inline-flex; }
    .preset-box input {
      width: 76px; padding: 8px 20px 8px 10px;
      font-family: var(--mono); font-size: 13px; font-weight: 650; color: var(--text);
      background: rgba(0,0,0,0.26); border: 1px solid var(--line);
      border-radius: 9px; transition: border-color .15s;
    }
    .preset-box input:focus { outline: none; border-color: var(--amber); }
    /* The spinners are noise at this size and steal the space the × needs. */
    .preset-box input::-webkit-outer-spin-button,
    .preset-box input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .preset-box input[type=number] { -moz-appearance: textfield; }
    .preset-del {
      position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; padding: 0; line-height: 1;
      display: grid; place-items: center;
      font: inherit; font-size: 13px; cursor: pointer;
      color: var(--faint); background: none; border: 0; border-radius: 4px;
      opacity: 0; transition: opacity .15s, color .15s;
    }
    /* Revealed on hover or keyboard focus — :focus-within covers the case
       where the × itself is tabbed to, which hover alone would never show. */
    .preset-box:hover .preset-del, .preset-box:focus-within .preset-del { opacity: 1; }
    .preset-del:hover { color: var(--red); background: rgba(255,95,86,0.14); }
    .preset-add {
      font: inherit; font-size: 12px; font-weight: 650; cursor: pointer;
      color: var(--dim); background: rgba(255,255,255,0.04);
      border: 1px dashed var(--line-2, rgba(255,255,255,0.14));
      border-radius: 9px; padding: 8px 12px;
      transition: color .15s, background .15s, border-color .15s;
    }
    .preset-add:hover { color: var(--text); background: rgba(255,255,255,0.08); border-color: var(--amber); }
    /* ---------- Settings: groups + search ----------
       Settings had grown to seventy-odd controls in one flat run of cards, so
       finding a known setting meant scrolling and reading every heading. Two
       ways in now: filter to a group, or type what you remember. Search wins
       when both are active — someone typing has a specific control in mind and
       should not also have to guess which group it was filed under. */
    .set-toolbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .set-search-wrap { position: relative; flex: 1 1 260px; min-width: 220px; }
    .set-search-ico {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      font-size: 12px; opacity: 0.55; pointer-events: none;
    }
    #set-search {
      width: 100%; font: inherit; font-size: 13px; color: var(--text);
      background: rgba(0,0,0,0.26); border: 1px solid var(--line);
      border-radius: 999px; padding: 9px 14px 9px 32px;
      transition: border-color .15s;
    }
    #set-search:focus { outline: none; border-color: var(--amber); }
    #set-search::-webkit-search-cancel-button { cursor: pointer; }

    .set-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .set-tab {
      font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--dim); background: rgba(255,255,255,0.04);
      border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px;
      transition: color .15s, background .15s, border-color .15s;
    }
    .set-tab:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .set-tab.on {
      color: #2A1400; font-weight: 750; border-color: transparent;
      background: linear-gradient(145deg, var(--amber-2, #FFC081), var(--amber) 60%, #E77B22);
    }

    .set-pane { margin-bottom: 26px; }
    .set-pane-title {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 11px; font-size: 12px; font-weight: 800;
      letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim);
    }
    /* While a group is selected the other panes are gone, so their heading is
       redundant — but during a SEARCH every surviving pane keeps its heading,
       because that is the label telling you where the match lives. */
    .set-panes.one-group .set-pane-title { display: none; }
    .set-pane[hidden], .field[hidden], .card[hidden] { display: none !important; }

    /* A search that hides most of a card can leave a lone control under a
       heading it does not belong to; dimming the heading keeps the card
       readable as "part of X" without competing with the match. */
    .set-panes.searching .card h3 { opacity: 0.6; }
    .set-panes.searching .field.hit label { color: var(--amber); }

    .set-none { margin: 30px 0; text-align: center; color: var(--dim); font-size: 13.5px; }
    .linkish {
      font: inherit; font-size: inherit; color: var(--amber);
      background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline;
    }
    .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; align-items: start; }

    .section { animation: fade-in 0.3s var(--ease) both; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

    /* ---------------- charts ---------------- */

    canvas.chart {
      display: block; width: 100%; height: 260px;
      background: rgba(0,0,0,0.22); border-radius: var(--r-md);
      border: 1px solid var(--line);
    }

    /* ---------------- tables ---------------- */

    .log { max-height: 430px; overflow-y: auto; border-radius: var(--r-md); }
    .log table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .log th {
      position: sticky; top: 0; z-index: 2;
      padding: 9px 11px; text-align: left;
      background: #121620;
      border-bottom: 1px solid var(--line);
      font-size: 9.5px; font-weight: 750; letter-spacing: 0.9px;
      text-transform: uppercase; color: var(--faint);
      white-space: nowrap;
    }
    .log td { padding: 10px 11px; border-bottom: 1px solid rgba(255,255,255,0.045); }
    .log tbody tr { transition: background 0.14s; }
    .log tbody tr:hover { background: rgba(255,255,255,0.035); }
    .log td.num, .log th.num { font-family: var(--mono); }

    .side-buy, .side-sell {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 800; letter-spacing: 0.5px;
    }
    .side-buy { color: var(--green); background: rgba(52, 211, 153, 0.14); }
    .side-sell { color: var(--red); background: rgba(255, 95, 86, 0.14); }

    /* ---------------- buttons ---------------- */

    .btn, .btn-sec, .btn-red {
      padding: 9px 16px; border-radius: var(--r-sm);
      font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
      transition: transform 0.13s var(--ease), filter 0.16s, background 0.16s, border-color 0.16s, box-shadow 0.2s;
    }
    .btn {
      border: none; color: #032B1B;
      background: linear-gradient(180deg, #3FE49B, #22B573);
      box-shadow: 0 7px 20px -8px rgba(34, 181, 115, 0.6), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .btn:hover { filter: brightness(1.07); }
    .btn:active { transform: translateY(1px) scale(0.99); }
    .btn:disabled { opacity: 0.55; cursor: default; filter: none; transform: none; }
    .btn-sec {
      background: var(--raised); border: 1px solid var(--line-2); color: var(--text);
    }
    .btn-sec:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.22); }
    .btn-sec:active { transform: translateY(1px) scale(0.99); }
    .btn-sec:disabled { opacity: 0.42; cursor: default; transform: none; }
    .btn-red {
      background: rgba(255, 95, 86, 0.14); border: 1px solid rgba(255, 95, 86, 0.35); color: #FFB3AE;
    }
    .btn-red:hover { background: #E0433A; color: #fff; border-color: transparent; }

    /* ---------------- forms ---------------- */

    input, select, textarea {
      width: 100%; margin-top: 5px; padding: 9px 11px;
      background: rgba(0,0,0,0.3); border: 1px solid var(--line);
      border-radius: var(--r-sm); color: var(--text);
      font-family: inherit; font-size: 13px;
      transition: border-color 0.16s, box-shadow 0.16s, background 0.16s;
    }
    /* The OPEN dropdown list is UA-drawn: without color-scheme it renders
       light while options inherit near-white text — white on white (the
       popup's Fees & costs had exactly this, amogus field report). */
    select { color-scheme: dark; }
    select option { background: #10141C; color: var(--text); }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: rgba(255, 157, 69, 0.6);
      box-shadow: 0 0 0 3px rgba(255, 157, 69, 0.12);
      background: rgba(0,0,0,0.42);
    }
    input[type="checkbox"] {
      width: auto; margin: 0 9px 0 0; accent-color: var(--amber);
      vertical-align: -2px; cursor: pointer;
    }
    /* One slider spec — the custom-thumb block further down is THE style
       for every range input (Wave 1: two conflicting declarations meant the
       settings slider silently inherited the replay scrubber's look). */
    input[type="range"] { width: 100%; margin-top: 8px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--dim); cursor: pointer; }
    .field small { display: block; margin-top: 4px; font-size: 11px; color: var(--faint); line-height: 1.45; }
    .field-check label { display: flex; align-items: center; color: var(--text); font-weight: 650; }

    /* ---------------- misc ---------------- */

    .review { white-space: pre-wrap; line-height: 1.6; font-size: 13px; }
    .review:empty { display: none; }
    .review.error { color: var(--red); }
    .hidden { display: none !important; }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .dim { color: var(--dim); }
    .amber { color: var(--amber); }
    .mono { font-family: var(--mono); }

    .frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px; }
    .frames img {
      width: 100%; aspect-ratio: 16/10; object-fit: cover;
      border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer;
      transition: transform 0.2s var(--ease), border-color 0.2s;
    }
    .frames img:hover { transform: scale(1.03); border-color: var(--amber); }

    .tag {
      display: inline-block; padding: 2px 8px; margin-right: 4px;
      background: var(--raised); border: 1px solid var(--line);
      border-radius: 999px; font-size: 10.5px; color: var(--dim);
    }
    .round-note {
      display: inline-block; max-width: 190px; vertical-align: middle;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 11.5px; color: var(--text);
    }
    .note-input {
      width: 100%; min-width: 170px; resize: vertical;
      background: var(--raised); color: var(--text);
      border: 1px solid var(--line-2); border-radius: var(--r-md);
      padding: 7px 9px; font: inherit; font-size: 12px; line-height: 1.5;
    }
    .note-input:focus { outline: none; border-color: var(--amber); }
    .note-actions { display: flex; gap: 6px; margin-top: 6px; }
    .note-actions .btn, .note-actions .btn-sec { padding: 5px 10px; font-size: 11.5px; }
    .stat {
      display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.045);
    }
    .stat:last-child { border-bottom: none; }
    .stat > span:first-child { font-size: 12px; color: var(--dim); }

    /* Trench Rank card (docs/GAMIFY.md) */
    .rank-gate { display: flex; align-items: center; gap: 12px; padding: 5px 0; }
    .rank-gate-label { flex: 0 0 58%; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .rank-bar-fill { height: 100%; background: var(--amber); }
    .rank-bar-fill.done { background: var(--green); }
    .rank-streaks { display: flex; gap: 18px; margin-top: 8px; }
    .rank-streaks .stat { flex: 1; border-bottom: none; padding: 4px 0; }
    .rank-badges { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
    .tag.badge { opacity: 0.38; }
    .tag.badge.earned { opacity: 1; border-color: var(--amber); color: var(--text); }
    .cal-grade { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; }

    /* Game tab — caution tape as a WATERMARK, not a banner (maintainer:
       "keep the color scheme, yellow in the background, the opacity and
       background watermark aesthetic"). One translucent amber tape band
       floats diagonally BEHIND the cards; the scheme stays dark/amber. */
    #game { position: relative; overflow: hidden; }
    #game > :not(.game-tape-bg) { position: relative; z-index: 1; }
    .game-tape-bg {
      position: absolute; left: -6%; right: -6%; top: 34%;
      transform: rotate(-4deg); pointer-events: none; z-index: 0;
      opacity: 0.07; overflow: hidden;
    }
    .game-tape-bg span {
      display: block; white-space: nowrap;
      font-weight: 900; font-size: 34px; letter-spacing: 7px; text-transform: uppercase;
      color: var(--amber); padding: 8px 0;
      border-top: 3px solid transparent; border-bottom: 3px solid transparent;
      border-image: repeating-linear-gradient(45deg, var(--amber) 0 10px, transparent 10px 20px) 1;
    }
    .game-lab::before { content: '“'; margin-right: 2px; color: var(--amber-2); }
    .game-lab::after { content: '”'; margin-left: 2px; color: var(--amber-2); }

    /* Game tab */
    .game-ladder { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .game-tier {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 5px 11px; border-radius: 999px;
      background: var(--raised); border: 1px solid var(--line);
      font-size: 11.5px; color: var(--dim);
    }
    .game-tier.done { border-color: rgba(52,211,153,.3); }
    .game-tier.current { border-color: var(--amber); color: var(--text); }
    .game-tier .tier-num { font-size: 9.5px; font-weight: 800; color: var(--faint); }
    .game-tier.current .tier-num { color: var(--amber); }
    .tier-here {
      font-size: 8.5px; font-weight: 800; letter-spacing: 0.8px;
      padding: 1px 6px; border-radius: 999px;
      background: rgba(255,157,69,.14); color: var(--amber);
    }
    .game-lab {
      margin: 18px 2px 10px; font-size: 9.5px; font-weight: 700;
      letter-spacing: 1.1px; text-transform: uppercase; color: var(--faint);
    }
    .game-card h3 { margin-bottom: 4px; }
    /* Equal-height game cards: the grid stretches, the card is a column,
       the start button pins to the bottom — "not the same size" fixed
       structurally, not by eyeballing content. */
    #game .grid3 { align-items: stretch; }
    .game-card { display: flex; flex-direction: column; }
    .game-card .stat { font-size: 12px; padding: 6px 0; }
    .game-card .stat:last-of-type { margin-bottom: 12px; }
    .game-card > button { margin-top: auto; }
    .game-session { border-color: var(--amber); }
    .game-grade { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
    .game-grade .rank-bar { flex: 1; }

    .empty {
      display: grid; place-items: center; gap: 8px;
      padding: 40px 20px; text-align: center; color: var(--faint);
    }
    .empty strong { color: var(--dim); font-size: 13px; font-weight: 650; }

    /* ---------------- replay ---------------- */

    .replay-layout { display: grid; grid-template-columns: 262px minmax(0, 1fr); gap: 16px; align-items: start; }
    .replay-list-card { position: sticky; top: 84px; max-height: calc(100vh - 108px); overflow-y: auto; }
    .replay-session-list { display: grid; gap: 6px; }
    .replay-session {
      display: flex; align-items: center; justify-content: space-between; gap: 9px;
      width: 100%; padding: 11px 12px; text-align: left;
      background: transparent; border: 1px solid var(--line); border-radius: var(--r-md);
      color: var(--text); font-family: inherit; font-size: 12.5px; cursor: pointer;
      transition: background 0.16s, border-color 0.16s, transform 0.16s var(--ease);
    }
    .replay-session:hover { background: var(--raised); transform: translateX(2px); }
    .replay-session.active {
      background: linear-gradient(135deg, rgba(255,157,69,0.14), rgba(255,157,69,0.03));
      border-color: rgba(255, 157, 69, 0.5);
    }
    .replay-session span:first-child { min-width: 0; }
    .replay-session strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .replay-session small { display: block; margin-top: 2px; font-size: 10px; color: var(--faint); }

    .replay-main { display: grid; gap: 14px; min-width: 0; }
    .replay-hero {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      background: linear-gradient(135deg, rgba(255,157,69,0.09), rgba(255,255,255,0.012));
    }
    .replay-hero h2 { margin: 0 0 4px; font-size: 21px; font-weight: 800; letter-spacing: -0.5px; }
    .replay-hero .dim { font-size: 11.5px; word-break: break-all; }
    .replay-result { font-size: 26px; font-weight: 850; letter-spacing: -0.9px; white-space: nowrap; }

    .replay-controls { display: grid; gap: 12px; }
    .replay-now { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .replay-now strong { font-size: 14px; font-weight: 750; }
    .replay-now span { font-family: var(--mono); font-size: 11.5px; color: var(--dim); white-space: nowrap; }

    input[type="range"] {
      width: 100%; margin: 0; padding: 0; height: 5px;
      appearance: none; -webkit-appearance: none;
      background: rgba(255,255,255,0.12); border: none; border-radius: 99px;
      cursor: pointer;
    }
    input[type="range"]:focus { box-shadow: none; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
      background: linear-gradient(145deg, var(--amber-2), var(--amber));
      border: 2px solid #0A0D13;
      box-shadow: 0 2px 9px rgba(255,157,69,0.55);
      transition: transform 0.15s var(--ease);
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.18); }
    input[type="range"]:disabled { opacity: 0.4; cursor: default; }

    .replay-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .replay-actions .dim { margin-left: auto; font-size: 11.5px; font-family: var(--mono); }
    .replay-ticks { display: flex; align-items: center; gap: 2px; min-height: 14px; }
    .replay-tick {
      flex: 1 1 4px; max-width: 20px; height: 6px; padding: 0;
      border: none; border-radius: 99px; background: rgba(255,255,255,0.16);
      cursor: pointer; transition: height 0.16s var(--ease), background 0.16s;
    }
    .replay-tick:hover { background: rgba(255,255,255,0.34); height: 10px; }
    .replay-tick.papertrench { background: rgba(255, 157, 69, 0.65); }
    .replay-tick.active { height: 14px; background: var(--amber); box-shadow: 0 0 10px rgba(255,157,69,0.65); }

    /* P&L share card */
    .card-modal {
      position: fixed; inset: 0; z-index: 200; display: none;
      align-items: center; justify-content: center; padding: 28px;
      background: rgba(4, 6, 10, 0.78); backdrop-filter: blur(6px);
    }
    .card-modal.open { display: flex; }
    .card-modal-inner {
      width: min(1080px, 96vw); max-height: 92vh; overflow-y: auto;
      background: var(--panel-solid); border: 1px solid var(--line);
      border-radius: var(--r-xl); box-shadow: var(--shadow-lg); padding: 20px;
    }
    .card-preview {
      display: block; width: 100%; height: auto; border-radius: var(--r-md);
      border: 1px solid var(--line); background: #05070A;
    }
    .card-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
    .card-drop {
      flex: 1; min-width: 240px; padding: 12px 14px; border-radius: var(--r-md);
      border: 1px dashed var(--line-2); color: var(--dim); font-size: 12.5px; cursor: pointer;
      transition: border-color .16s, color .16s, background .16s;
    }
    .card-drop:hover, .card-drop.hot { border-color: var(--amber); color: var(--amber-2); background: rgba(255,157,69,.06); }
    .card-drop input { display: none; }
    .card-gallery {
      display: flex; gap: 8px; align-items: stretch; margin-top: 12px;
      overflow-x: auto; padding-bottom: 4px;
    }
    .card-thumb {
      position: relative; flex: none; width: 120px; height: 68px; padding: 0;
      border: 2px solid var(--line); border-radius: var(--r-sm); overflow: hidden;
      background: #05070A; cursor: pointer;
      transition: border-color .16s, transform .16s;
    }
    .card-thumb:hover { border-color: var(--line-2); transform: translateY(-1px); }
    .card-thumb.selected { border-color: var(--amber); box-shadow: 0 0 10px rgba(255,157,69,.35); }
    .card-thumb canvas { display: block; width: 100%; height: 100%; }
    .card-thumb .del {
      position: absolute; top: 3px; right: 3px; width: 18px; height: 18px;
      display: grid; place-items: center; border-radius: 50%;
      background: rgba(4,6,10,.82); color: var(--dim); font-size: 13px; line-height: 1;
    }
    .card-thumb .del:hover { color: var(--red); }
    .card-upload-tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; border-style: dashed; color: var(--dim); font-size: 11.5px; font-weight: 650;
    }
    .card-upload-tile small { font-size: 9.5px; color: var(--faint); font-weight: 500; }
    .card-upload-tile:hover { border-color: var(--amber); color: var(--amber-2); }
    .card-custom {
      display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
      margin-top: 12px; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: var(--r-md);
      background: rgba(255,255,255,.03); font-size: 12.5px;
    }
    .card-custom label { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); cursor: pointer; }
    .card-accents { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
    .accent-swatch {
      width: 18px; height: 18px; padding: 0; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
    }
    .accent-swatch.selected { border-color: var(--text); }

    /* leaderboard */
    .lb-verify {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-radius: var(--r-md);
      border: 1px solid var(--line); background: rgba(255,255,255,.03);
    }
    .lb-verify.ok { border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.07); }
    .lb-verify.bad { border-color: rgba(255,95,86,.45); background: rgba(255,95,86,.08); }
    .lb-badge {
      width: 30px; height: 30px; border-radius: 9px; flex: none;
      display: grid; place-items: center; font-size: 15px; font-weight: 900;
    }
    .lb-verify.ok .lb-badge { background: rgba(52,211,153,.16); color: var(--green); }
    .lb-verify.bad .lb-badge { background: rgba(255,95,86,.16); color: var(--red); }
    .lb-verify .t { font-weight: 750; font-size: 13px; }
    .lb-verify .s { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
    .lb-rank {
      display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px;
      padding: 11px 12px; border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .lb-rank:last-child { border-bottom: none; }
    .lb-rank .pos { font-family: var(--mono); font-weight: 800; color: var(--faint); text-align: center; }
    .lb-rank.me { background: linear-gradient(90deg, rgba(255,157,69,.10), transparent); border-radius: var(--r-sm); }
    .lb-rank.me .pos { color: var(--amber); }
    .lb-handle { font-weight: 700; }
    .lb-handle small { display: block; font-size: 10.5px; color: var(--faint); font-weight: 500; margin-top: 2px; }
    .lb-x {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 7px; border-radius: 999px; margin-left: 6px;
      background: rgba(255,255,255,.06); border: 1px solid var(--line);
      font-size: 9.5px; font-weight: 700; color: var(--dim); vertical-align: 1px;
    }
    .lb-x.verified { color: var(--blue); border-color: rgba(106,169,255,.35); background: rgba(106,169,255,.10); }
    .lb-proof {
      font-family: var(--mono); font-size: 10.5px; color: var(--faint);
      word-break: break-all; line-height: 1.5;
    }

    /* ---------- Leaderboard onboarding ----------
       The tab used to open on chain heads and six honesty rules for someone
       who had not yet linked an account. Three steps, one actionable at a
       time; the board itself replaces this once they are done. */
    .lb-intro { margin-bottom: 16px; }
    .lb-progress { display: flex; align-items: center; gap: 7px; margin-top: 14px; }
    .lb-pip {
      width: 34px; height: 4px; border-radius: 999px;
      background: rgba(255,255,255,0.12);
    }
    .lb-pip.on { background: linear-gradient(90deg, var(--amber-2, #FFC081), var(--amber)); }
    .lb-progress-label { margin-left: 6px; font-size: 11.5px; font-weight: 650; color: var(--dim); }

    .lb-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    /* ---------- onboarding: one centred question ----------
       The list showed all three steps at once, two of which the reader could
       not act on yet — a step you cannot do is a step you have to read past. */
    .lb-onboard { max-width: 520px; margin: 40px auto 0; text-align: center; }
    .lb-onboard-card {
      padding: 34px 32px 30px;
      background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.014));
      border: 1px solid var(--line-2); border-radius: var(--r-xl);
      box-shadow: var(--shadow-lg);
    }
    .lb-onboard .lb-progress { justify-content: center; margin: 0 0 14px; }
    .lb-onboard .lb-pip.now { background: rgba(255,157,69,0.45); }
    .lb-onboard-count {
      font-size: 10px; font-weight: 800; letter-spacing: 1.4px;
      text-transform: uppercase; color: var(--faint);
    }
    .lb-onboard-q { margin: 10px 0 0; font-size: 23px; font-weight: 800; letter-spacing: -0.4px; }
    .lb-onboard-why {
      margin: 10px auto 0; max-width: 420px;
      font-size: 13.5px; line-height: 1.65; color: var(--dim);
    }
    /* The action is the only thing here that is not prose, so it gets the
       whitespace that makes it read as the thing to do. */
    .lb-onboard-do { margin-top: 22px; text-align: left; }
    .lb-onboard-do > .btn { display: block; text-align: center; }
    .lb-onboard-do .field { text-align: left; }
    .lb-onboard-do p.dim { text-align: center; }

    .lb-onboard-done {
      list-style: none; margin: 22px 0 0; padding: 16px 0 0;
      border-top: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 5px;
      font-size: 12px; color: var(--green);
    }
    .lb-onboard-more { margin-top: 20px; text-align: left; }
    .lb-onboard-more summary { cursor: pointer; font-size: 12.5px; color: var(--dim); }
    .lb-onboard-more ul { margin: 10px 0 0; padding-left: 18px; color: var(--dim); font-size: 12.5px; line-height: 1.65; }
    .lb-step {
      display: flex; gap: 14px; padding: 16px 18px;
      background: linear-gradient(155deg, rgba(255,255,255,0.042), rgba(255,255,255,0.012));
      border: 1px solid var(--line); border-radius: var(--r-xl);
      transition: border-color .2s, opacity .2s;
    }
    /* Only the current step is at full strength. A later step still readable
       at full contrast reads as another thing to do now, which is the exact
       "wall of options" this replaces. */
    .lb-step.later { opacity: 0.5; }
    .lb-step.now { border-color: rgba(255,157,69,0.4); box-shadow: 0 8px 26px -14px rgba(255,157,69,0.5); }
    .lb-step.done .lb-step-n { background: rgba(52,211,153,0.16); color: var(--green, #34D399); border-color: rgba(52,211,153,0.4); }
    .lb-step.now .lb-step-n { background: linear-gradient(145deg, var(--amber-2, #FFC081), var(--amber) 60%, #E77B22); color: #2A1400; border-color: transparent; }
    .lb-step-n {
      width: 28px; height: 28px; flex: none; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 12.5px; font-weight: 800; color: var(--dim);
      background: rgba(255,255,255,0.05); border: 1px solid var(--line);
    }
    .lb-step-body { min-width: 0; flex: 1; }
    .lb-step-body h4 { margin: 3px 0 5px; font-size: 14.5px; font-weight: 750; }
    .lb-step-body > p.dim { margin: 0 0 10px; font-size: 12.5px; line-height: 1.6; }
    .lb-step.done .lb-step-body > p.dim, .lb-step.later .lb-step-body > p.dim { margin-bottom: 0; }
    .lb-step-wait { margin: 0; font-size: 12px; font-style: italic; }

    /* ---------- leaderboard hero + folds ----------
       The tab used to open on two dense cards of chain vocabulary before the
       reader reached a single standing. The hero answers "how am I doing" in
       one row; the evidence that backs it is one disclosure away. */
    .lb-hero {
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      padding: 18px 20px;
      background: linear-gradient(150deg, rgba(255,255,255,0.05), rgba(255,255,255,0.014));
      border: 1px solid var(--line-2); border-radius: var(--r-xl);
      box-shadow: var(--shadow-md);
    }
    .lb-hero-me { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .lb-hero-handle { font-size: 15px; font-weight: 800; letter-spacing: -0.2px; }
    .lb-hero-roi {
      margin-left: auto; text-align: right;
      font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.05;
    }
    .lb-hero-roi-lab {
      display: block; margin-top: 2px;
      font-size: 9.5px; font-weight: 700; letter-spacing: 1.1px;
      text-transform: uppercase; color: var(--faint);
    }
    /* The verify chip drops to its own line rather than squeezing the ROI. */
    .lb-hero-verify { flex: 1 0 100%; margin: 0; }

    .lb-fold {
      background: linear-gradient(155deg, rgba(255,255,255,0.03), rgba(255,255,255,0.008));
      border: 1px solid var(--line); border-radius: var(--r-lg);
    }
    .lb-fold > summary {
      cursor: pointer; padding: 13px 18px; list-style: none;
      font-size: 12px; font-weight: 750; letter-spacing: 0.9px;
      text-transform: uppercase; color: var(--dim);
    }
    .lb-fold > summary::-webkit-details-marker { display: none; }
    .lb-fold > summary::after { content: " ▾"; color: var(--faint); }
    .lb-fold[open] > summary::after { content: " ▴"; }
    .lb-fold > summary:hover { color: var(--text); }
    .lb-fold-body { padding: 0 18px 16px; }
    /* ---------- Live board ---------- */
    .lb-live-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .lb-live-head .btn-sec { margin-left: auto; }
    .lb-live { margin-top: 6px; }
    .lb-clan { font-size: 10.5px; font-weight: 700; color: var(--amber); margin-left: 5px; }
    .lb-gap { text-align: center; color: var(--faint); font-size: 14px; letter-spacing: 3px; padding: 4px 0; }

    /* session tape */
    .tape { max-height: 300px; overflow-y: auto; margin: -4px -4px 0; padding: 0 4px; }
    .tape-row {
      display: grid; grid-template-columns: 62px 16px minmax(120px, 1fr) auto;
      align-items: center; gap: 10px;
      width: 100%; padding: 8px 9px; margin-bottom: 2px;
      background: transparent; border: 1px solid transparent; border-radius: var(--r-sm);
      color: var(--text); font-family: inherit; font-size: 12px; text-align: left; cursor: pointer;
      transition: background 0.14s, border-color 0.14s;
    }
    .tape-row:hover { background: var(--raised); }
    .tape-row.active {
      background: linear-gradient(90deg, rgba(255,157,69,0.14), rgba(255,255,255,0.02));
      border-color: rgba(255,157,69,0.4);
    }
    .tape-time { font-size: 11px; color: var(--faint); }
    .tape-icon { text-align: center; }
    .tape-label { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tape-detail { font-size: 11px; text-align: right; white-space: nowrap; }
    @media (max-width: 860px) {
      .tape-row { grid-template-columns: 56px 16px 1fr; }
      .tape-detail { display: none; }
    }

    .replay-video video {
      display: block; width: 100%; max-height: 560px;
      background: #05070A; border: 1px solid var(--line); border-radius: var(--r-md);
    }
    .replay-video-meta {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: 8px; font-size: 11.5px; color: var(--faint);
    }
    .replay-source-tabs { display: flex; gap: 4px; }
    .replay-source-tabs button {
      padding: 4px 10px; border-radius: 999px;
      background: transparent; border: 1px solid var(--line); color: var(--dim);
      font-family: inherit; font-size: 11px; font-weight: 650; cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .replay-source-tabs button:hover { color: var(--text); background: var(--raised); }
    .replay-source-tabs button.active {
      color: var(--amber-2); border-color: rgba(255,157,69,0.5);
      background: rgba(255,157,69,0.12);
    }

    .replay-frame img {
      display: block; width: 100%; max-height: 540px; object-fit: contain;
      background: #05070A; border: 1px solid var(--line); border-radius: var(--r-md);
      margin-bottom: 8px;
    }

    .coverage-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .coverage {
      padding: 5px 10px; border-radius: 999px;
      border: 1px solid var(--line); font-size: 11px;
    }
    .coverage.ready { color: var(--green); background: rgba(52,211,153,0.09); border-color: rgba(52,211,153,0.28); }
    .coverage.unavailable { color: var(--faint); }
    .warn { color: var(--amber); font-size: 12px; margin: 10px 0 0; }

    /* ---------------- P&L calendar ---------------- */

    .cal-nav { display: inline-flex; align-items: center; gap: 9px; margin-left: auto; }
    .cal-month {
      min-width: 128px; text-align: center;
      font-size: 13px; font-weight: 750; color: var(--text);
      text-transform: none; letter-spacing: 0;
    }
    .cal-nav-btn {
      width: 26px; height: 26px; padding: 0; line-height: 1;
      border-radius: var(--r-sm); border: 1px solid var(--line);
      background: var(--raised); color: var(--dim);
      font-family: inherit; font-size: 15px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .cal-nav-btn:hover:not(:disabled) { color: var(--text); border-color: var(--line-2); }
    .cal-nav-btn:disabled { opacity: 0.35; cursor: default; }


    /* ---- Trench Grid (A1) ---- */
    .tg-year { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 0 6px; }
    .tg-month { min-width: 150px; }
    .tg-month-name { font-size: 11px; color: var(--muted, #8b93a7); margin-bottom: 4px; }
    .tg-days { display: grid; grid-template-columns: repeat(7, 15px); grid-auto-flow: column;
      grid-template-rows: repeat(6, 15px); gap: 2px; }
    .tg-days .tg-cell { grid-row: calc(var(--tg-off) + 1) / span 1; }
    .tg-cell { width: 15px; height: 15px; border-radius: 3px; display: inline-block;
      border: 1px solid rgba(255,255,255,0.06); }
    .tg-empty { background: transparent; border-color: rgba(255,255,255,0.08); }
    .tg-s { background: var(--green); }
    .tg-a { background: color-mix(in srgb, var(--green) 72%, transparent); }
    .tg-b { background: color-mix(in srgb, var(--green) 44%, transparent); }
    .tg-c { background: color-mix(in srgb, var(--red) 38%, transparent); }
    .tg-d { background: color-mix(in srgb, var(--red) 66%, transparent); }
    .tg-f { background: var(--red); }
    .tg-streaks { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .tg-chip { border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
      padding: 3px 10px; font-size: 12px; }
    .tg-legend { display: flex; align-items: center; gap: 4px; font-size: 11px; margin-top: 6px; }
    .tg-legend .tg-cell { width: 12px; height: 12px; }
    .tg-sub { max-width: 720px; margin: 4px 0 10px; }

    /* ---- Daily Spark (A2) ---- */
    .spark-head { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 10px; }
    .spark-title { font-size: 13px; font-weight: 800; letter-spacing: 1.4px; color: var(--text); }
    .spark-date { font-size: 12px; color: var(--dim); }
    .spark-about { font-size: 12.5px; color: var(--muted, #8b93a7); line-height: 1.55;
      margin: 0 0 12px; max-width: 640px; }
    .spark-body { max-width: 720px; }
    .spark-chart { position: relative; border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px; padding: 10px; background: rgba(10,13,19,0.5); }
    .spark-canvas { width: 100%; height: auto; display: block; cursor: crosshair; }
    .spark-chart-legend { display: flex; gap: 14px; margin-top: 8px; font-size: 11px; color: var(--dim); }
    .spark-legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .spark-legend-item i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    .spark-lane-key { background: rgba(255,157,69,0.18);
      border: 1px dashed rgba(255,157,69,0.55); border-radius: 2px; }
    .spark-hint { font-size: 12.5px; color: var(--dim); margin: 10px 0 0; line-height: 1.5; min-height: 1.5em; }
    .spark-picks { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 0; }
    .spark-pick { display: flex; align-items: center; gap: 10px; font-size: 12.5px;
      border: 1px solid rgba(255,255,255,0.10); border-radius: 8px; padding: 6px 10px;
      background: rgba(255,255,255,0.03); max-width: 480px; }
    .spark-pick-name { display: inline-flex; align-items: center; gap: 6px; font-weight: 750; }
    .spark-pick-name i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
    .spark-pick-min { color: var(--dim); }
    .spark-pick-ctl { margin-left: auto; display: inline-flex; gap: 4px; }
    .spark-pick-ctl button { border: 1px solid rgba(255,255,255,0.16); border-radius: 6px;
      background: rgba(255,255,255,0.04); color: var(--text); cursor: pointer;
      min-width: 26px; height: 24px; font-size: 13px; line-height: 1; }
    .spark-pick-ctl button:hover:not(:disabled) { border-color: var(--accent, #FF9D45); }
    .spark-pick-ctl button:disabled { opacity: 0.4; cursor: default; }
    .spark-actions { display: flex; gap: 8px; margin: 12px 0 6px; flex-wrap: wrap; }
    .spark-btn { border: 1px solid rgba(255,255,255,0.18); border-radius: 8px;
      padding: 8px 14px; font-size: 12.5px; font-weight: 750; letter-spacing: 0.8px;
      background: rgba(255,255,255,0.04); color: var(--text); cursor: pointer; }
    .spark-btn:hover:not(:disabled) { border-color: var(--accent, #FF9D45); color: var(--accent, #FF9D45); }
    .spark-btn:disabled { opacity: 0.4; cursor: default; }
    .spark-btn.armed { border-color: var(--green); color: var(--green); }
    .spark-verdict { margin-top: 14px; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 14px; background: rgba(10,13,19,0.5); }
    .spark-grade { font-size: 64px; font-weight: 800; line-height: 1; }
    .spark-grade-label { font-size: 15px; font-weight: 750; margin-top: 4px; }
    .spark-axis-line { font-size: 12.5px; color: var(--dim); margin-top: 8px; }
    .spark-story { font-size: 12.5px; color: var(--muted, #8b93a7); margin-top: 10px; line-height: 1.5; }
    .spark-share-row { margin-top: 12px; }
    .spark-error { color: var(--red); font-size: 12.5px; margin: 8px 0 0; }

    /* ---- Trench Wrapped (B1) ---- */
    .wr-head { margin: 4px 0 10px; }
    .wr-letter { font-size: 84px; font-weight: 800; line-height: 1;
      letter-spacing: -2px; }
    .wr-letter-label { font-size: 15px; font-weight: 750; margin-top: 2px; }
    .wr-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px; margin: 14px 0; }
    .wr-stat { border: 1px solid rgba(255,255,255,0.10); border-radius: 10px;
      padding: 12px 14px; background: rgba(10,13,19,0.5); }
    .wr-stat-label { font-size: 10.5px; font-weight: 750; letter-spacing: 1.1px;
      text-transform: uppercase; color: var(--dim); }
    .wr-stat-value { font-size: 15px; font-weight: 700; color: var(--text); margin-top: 4px; }
    .wr-share-row { margin-top: 14px; }

    .cal-summary {
      display: flex; flex-wrap: wrap; gap: 7px 20px;
      margin-bottom: 15px; font-size: 12px; color: var(--dim);
    }
    .cal-summary strong { color: var(--text); font-weight: 750; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr) 64px; gap: 5px; }
    .cal-head {
      padding-bottom: 5px; text-align: center;
      font-size: 9.5px; font-weight: 750; letter-spacing: 0.9px;
      text-transform: uppercase; color: var(--faint);
    }
    .cal-week-head { text-align: right; }
    .cal-day {
      position: relative; /* anchors the .cal-grade process dot */
      min-height: 60px; padding: 7px 8px;
      display: flex; flex-direction: column; gap: 2px;
      background: rgba(255, 255, 255, 0.018);
      border: 1px solid var(--line); border-radius: var(--r-sm);
      transition: border-color 0.15s, background 0.15s;
    }
    .cal-day.blank { visibility: hidden; }
    .cal-day .cal-date { font-size: 10px; font-weight: 700; color: var(--faint); }
    .cal-day .cal-pnl { margin-top: 1px; font-size: 13.5px; font-weight: 800; letter-spacing: -0.3px; }
    .cal-day .cal-trades { margin-top: auto; font-size: 9.5px; color: var(--faint); }
    .cal-day.win { background: rgba(52, 211, 153, 0.07); border-color: rgba(52, 211, 153, 0.22); }
    .cal-day.win .cal-pnl { color: var(--green); }
    .cal-day.loss { background: rgba(255, 95, 86, 0.07); border-color: rgba(255, 95, 86, 0.22); }
    .cal-day.loss .cal-pnl { color: var(--red); }
    .cal-day.flat .cal-pnl { color: var(--dim); }
    .cal-day .cal-pnl.cal-zero { color: var(--faint); font-weight: 650; }
    .cal-day.today {
      border-color: rgba(255, 157, 69, 0.6);
      box-shadow: 0 0 0 1px rgba(255, 157, 69, 0.25);
    }
    .cal-day.today .cal-date { color: var(--amber-2); }
    .cal-week {
      display: flex; align-items: center; justify-content: flex-end;
      align-self: stretch;
      padding: 7px 8px;
      font-size: 12.5px; font-weight: 800;
      background: rgba(255, 255, 255, 0.018);
      border: 1px solid var(--line); border-radius: var(--r-sm);
    }
    .cal-week-empty { color: var(--faint); font-weight: 400; }

    /* Wave 1: ~10 selector families from the pre-v2 replay design deleted —
       zero JS references. .replay-errors stays; it is still rendered. */
    .replay-errors { border-color: rgba(255,157,69,0.35); }
    .replay-errors p { margin: 6px 0; color: var(--amber); font-size: 12px; }

    details summary { cursor: pointer; font-size: 12px; color: var(--dim); padding: 6px 0; }
    details summary:hover { color: var(--text); }

    @media (max-width: 1080px) {
      .replay-layout { grid-template-columns: 1fr; }
      .replay-list-card { position: static; max-height: 260px; }
      aside { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="ptmA" x1="23" y1="3.19" x2="4" y2="13.5" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFC94A"/><stop offset=".55" stop-color="#FF9D32"/><stop offset="1" stop-color="#F5751F"/></linearGradient><linearGradient id="ptmB" x1="23" y1="3.19" x2="11" y2="20.8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FBA23A"/><stop offset=".6" stop-color="#F87A24"/><stop offset="1" stop-color="#EE5F1C"/></linearGradient></defs><path d="M23 3.19 L1 10.56 L8.74 15.68 Z" fill="url(#ptmA)"/><path d="M23 3.19 L8.74 15.68 L9.2 18.24 L13.07 20.8 Z" fill="url(#ptmB)"/></svg></div>
      <h1>PaperTrench</h1>
      <span class="badge">PAPER ONLY</span>
    </div>
    <nav>
      <button class="active" data-section="overview">Overview</button>
      <button data-section="game">Game</button>
      <button data-section="calendar">Calendar</button>
      <button data-section="grid">Trench Grid</button>
      <button data-section="spark">Daily Spark</button>
      <button data-section="wrapped">Wrapped</button>
      <button data-section="journal">Journal</button>
      <button data-section="rounds">Rounds</button>
      <button data-section="perps">Perps</button>
      <button data-section="replay">Replay</button>
      <button data-section="leaderboard">Leaderboard</button>
      <button data-section="coach">AI Coach</button>
      <button data-section="settings">Settings</button>
    </nav>
    <button id="stream-overlay-btn" class="overlay-launch" title="Open the capture-ready stream overlay window for OBS">🎥 Stream overlay</button>
  </header>
  <div class="wrap">
    <aside id="sidebar"></aside>
    <main>
      <section id="overview" class="section"></section>
      <section id="game" class="section hidden"></section>
      <section id="calendar" class="section hidden"></section>
      <section id="grid" class="section hidden"></section>
      <section id="spark" class="section hidden"></section>
      <section id="wrapped" class="section hidden"></section>
      <section id="journal" class="section hidden"></section>
      <section id="rounds" class="section hidden"></section>
      <section id="perps" class="section hidden"></section>
      <section id="replay" class="section hidden"></section>
      <section id="leaderboard" class="section hidden"></section>
      <section id="coach" class="section hidden"></section>
      <section id="settings" class="section hidden"></section>
    </main>
  </div>
  <script src="fees.js"></script>
  <script src="slippage.js"></script>
  <script src="engine.js"></script>
  <script src="forge-core.js"></script>
  <script src="attest.js"></script>
  <script src="pnlcard.js"></script>
  <script src="recordings.js"></script>
  <script src="replay.js"></script>
  <script src="perps-venues.js"></script>
  <script src="perps.js"></script>
  <script src="mastery.js"></script>
  <script src="gamify.js"></script>
  <script src="trench-grid.js"></script>
  <script src="spark.js"></script>
  <script src="wrapped.js"></script>
  <!-- The modal must exist before dashboard.js runs (D-53): bindShareCard
       silently disables the composer if #card-modal is missing, and the old
       order was safe only by accident of init() being async. -->
  <div class="card-modal" id="card-modal">
    <div class="card-modal-inner">
      <h3 style="margin:0 0 12px;font-size:10.5px;font-weight:750;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)">Share P&amp;L card</h3>
      <canvas class="card-preview" id="card-canvas" width="1200" height="675"></canvas>
      <!-- Background gallery: built-ins painted procedurally by pnlcard.js,
           user uploads persisted in IndexedDB (max 2 MB each, 10 stored — a
           full gallery refuses new images rather than silently evicting). -->
      <div class="card-gallery" id="card-gallery"></div>
      <div class="card-controls">
        <!-- D-45: the card is drawn once onto a canvas, so an animated GIF
             renders as its first frame. The label says so instead of
             promising animation the composer does not deliver. -->
        <label class="card-drop" id="card-drop">
          Click or drop an image (max 2 MB) — it joins your gallery below; a GIF renders as a still (its first frame)
          <input type="file" id="card-file" accept="image/*">
        </label>
        <button class="btn-sec" id="card-customize">Customize</button>
        <button class="btn-sec" id="card-copy">Copy</button>
        <button class="btn" id="card-download">Download PNG</button>
        <button class="btn-sec" id="card-close">Close</button>
      </div>
      <div class="card-custom hidden" id="card-custom">
        <label><input type="checkbox" id="card-flag-symbol"> Symbol</label>
        <label><input type="checkbox" id="card-flag-invested"> Invested</label>
        <label><input type="checkbox" id="card-flag-returned"> Returned</label>
        <label><input type="checkbox" id="card-flag-percent"> P&amp;L %</label>
        <label><input type="checkbox" id="card-flag-usd"> USD sub-lines</label>
        <label><input type="checkbox" id="card-flag-date"> Date</label>
        <label><input type="checkbox" id="card-flag-after"> After-exit line</label>
        <label><input type="checkbox" id="card-flag-trench"> Rank &amp; grade</label>
        <span class="card-accents" id="card-accents">
          <span class="dim" style="font-size:11px">Trim</span>
          <button class="accent-swatch" data-accent="amber" title="Amber" style="background:#FF9D45"></button>
          <button class="accent-swatch" data-accent="blue" title="Blue" style="background:#6AA9FF"></button>
          <button class="accent-swatch" data-accent="violet" title="Violet" style="background:#B786FF"></button>
          <button class="accent-swatch" data-accent="teal" title="Teal" style="background:#3ED8C3"></button>
        </span>
      </div>
      <p class="dim" id="card-msg" style="display:none;margin:10px 0 0;font-size:11.5px;color:var(--red)"></p>
      <p class="dim" style="margin:12px 0 0;font-size:11.5px;line-height:1.5">
        The <strong>PAPER</strong> watermark and the PaperTrench brand bar are always drawn — no
        setting turns them off — so a shared paper trade can never be mistaken for a real one.
      </p>
    </div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
